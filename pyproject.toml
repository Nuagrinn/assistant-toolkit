[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-toolkit"
version = "0.1.0"
description = "Shared infrastructure helpers for personal assistant Telegram bots."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Nuagrinn" }
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

